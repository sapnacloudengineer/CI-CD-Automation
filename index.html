<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cloud Project</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
            background: rgba(0,0,0,0.2);
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 18px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background: #fff;
            color: #333;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #ddd;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

    <header>
        🚀 My Cloud Engineer Project
    </header>

    <div class="container">
        <h1>Welcome to My Website</h1>
        <p>This site is deployed using EC2, Docker & CI/CD</p>

        <button onclick="showMessage()">Click Me</button>
    </div>

    <footer>
        © 2026 My Project | Built by You 💪
    </footer>

    <script>
        function showMessage() {
            alert("🎉 Your CI/CD project is working!");
        }
    </script>

</body>
</html>
